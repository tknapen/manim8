name: ci
on:
  push:
  pull_request:
  workflow_dispatch:        # run by hand, e.g. when GitHub failed to start a job

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit -q
      - run: uv run scianim validate examples/families/computational_neuroscience/divisive_normalization
      - run: uv run scianim validate examples/families/computational_neuroscience/prf_tuning
      - run: uv run scianim validate examples/families/computational_neuroscience/orientation_tuning
      - run: uv run scianim validate examples/families/computational_neuroscience/gabor_filter
      - run: uv run scianim validate examples/families/computational_neuroscience/drop_impact
      - run: uv run scianim schemas export schemas --check
      - run: uv run scianim patterns check

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: The committed bundle must match the source
        run: git diff --exit-code --stat src/scianim/server/static

  family-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - run: uv run scianim workspace init workspace --with-example
      - run: uv run scianim family env sync workspace/families/computational_neuroscience
      - run: uv run scianim doctor --project workspace/families/computational_neuroscience/divisive_normalization
      - run: uv run scianim workspace list workspace
      - run: uv run --project workspace/families/computational_neuroscience pytest packages/scianim_bridge/tests -q
      - run: uv run pytest tests/integration -q -m integration --basetemp="$RUNNER_TEMP/pytest"
      - name: Keep the render records of a failed integration run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-render-records
          path: |
            ${{ runner.temp }}/pytest/**/manifest.json
            ${{ runner.temp }}/pytest/**/worker.log
            ${{ runner.temp }}/pytest/**/result.json
            ${{ runner.temp }}/pytest/**/job.json
            !${{ runner.temp }}/pytest/**/.venv/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Render the dry-run example for the browser test
        run: |
          uv run scianim codegen workspace/families/computational_neuroscience/prf_tuning
          uv run scianim snapshot workspace/families/computational_neuroscience/prf_tuning --all
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Browser acceptance against the served UI
        run: |
          setsid uv run scianim serve --workspace workspace --port 8765 > serve.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/projects > /dev/null && break; sleep 1; done
          status=0
          node tests/ui/e2e.mjs || { status=1; cat serve.log; }
          kill -- -"$SERVER" 2>/dev/null || kill "$SERVER" 2>/dev/null || true
          wait "$SERVER" 2>/dev/null || true
          exit "$status"

  release-install:
    # The three wheels, installed into an empty environment, render the example from the installed command.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
      - run: uv python install 3.12
      - run: .github/scripts/release_install_check.sh "$RUNNER_TEMP/release"


  git-install:
    # manim8 installed from git, not editable, as another tool installs it: the example family must take the bridge
    # from the same commit, and `render --json` must answer for a fresh and a cached job and under `--style`
    # (ADR-043). The full history lets uv fetch the commit from this checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
      - run: uv python install 3.12
      - run: .github/scripts/git_install_check.sh "$RUNNER_TEMP/git-install"
