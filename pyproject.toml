[project]
name = "manim8"
version = "0.1.0a0"
description = "SciAnim Studio control plane: validation, style resolution, families, jobs and CLI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "manim8-core==0.1.0a0",
  "pydantic>=2.10,<3",
  "typer>=0.15",
  "ruamel.yaml>=0.18",
  "rich>=13",
  "jinja2>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pillow>=10",
  "pypdf>=5",
]

[project.scripts]
scianim = "scianim.cli:app"
manim8 = "scianim.cli:app"


[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = ["packages/scianim_core"]

[tool.uv.sources]
manim8-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# An installed control plane carries the style sheets, the example templates (ADR-037) and the pattern library
# (ADR-040); the specimens and anything rendered stay in the repository.
only-include = ["src/scianim", "styles", "examples", "patterns"]
exclude = ["*.png", "*.pdf", "**/.venv", "**/renders", "**/.scianim", "**/__pycache__"]
# An editable install (a checkout) puts `src/` on the path and reads styles, examples and patterns from the repository.
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"styles" = "scianim/_data/styles"
"examples" = "scianim/_data/examples"
"patterns" = "scianim/_data/patterns"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "packages/scianim_core/src", "packages/scianim_bridge/src", "tests"]
extend-exclude = ["examples/**/code", "examples/**/.venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: `ruff format` governs code lines; the remaining long lines are user-facing messages.
ignore = ["RUF012", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]
"src/scianim/review/sheet.py" = ["E501"]
"packages/scianim_bridge/src/scianim_bridge/components/base.py" = ["RUF001"]  # Greek glyph table
"tools/specimen_twin_ink.py" = ["RUF001"]  # Greek letters in plate labels

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a synced family environment",
    "video: renders videos (the long ones)",
    "surface: renders surfaces and the orbiting camera",
    "loop: the agent loop and the review server",
    "bundle: export and import of bundles",
]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
