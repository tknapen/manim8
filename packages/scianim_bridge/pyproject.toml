[project]
name = "manim8-bridge"
version = "0.1.0a0"
description = "manim8 render bridge (import name `scianim_bridge`): style tokens, components, in-flow checkpoints, layout reports and the worker."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "manim8-core==0.1.0a0",
  "manim[typst]>=0.22,<0.23",
  "pydantic>=2.10,<3",
  "numpy>=2.1",
  "pillow>=11",
]

[project.scripts]
scianim-worker = "scianim_bridge.worker:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scianim_bridge"]
