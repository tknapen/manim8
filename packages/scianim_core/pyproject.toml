[project]
name = "manim8-core"
version = "0.1.0a0"
description = "manim8 contracts (import name `scianim_core`): Pydantic models for specs, the component registry, jobs and manifests."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scianim_core"]
