schema_version: "1.0"
project_id: gabor_filter
based_on_animation_revision: "draft"
scenes:
  - id: gabor
    start_seconds: 0
    end_seconds: 24
    purpose: "One Gabor filter in three dimensions: turn around it while its orientation, frequency and size change in turn."
    narration:
      text: >-
        A Gabor filter is a sinusoidal carrier under a Gaussian envelope. Turning the carrier changes
        its orientation, raising the frequency packs more cycles under the envelope, and shrinking
        sigma narrows the envelope.
    objects:
      - id: gabor_surface
        kind: surface_plot
        style_role: primary_signal
        equation: {id: gabor}
        params:
          x_label: "x (deg)"
          y_label: "y (deg)"
          z_label: "g"
          x_range: [-3, 3]
          y_range: [-3, 3]
          z_range: [-1, 1]
          expression: >-
            exp(-((x * cos(theta * pi / 180) + y * sin(theta * pi / 180))^2
            + (-x * sin(theta * pi / 180) + y * cos(theta * pi / 180))^2) / (2 * sigma^2))
            * cos(2 * pi * f * (x * cos(theta * pi / 180) + y * sin(theta * pi / 180)) + phi)
          parameters: {theta: 0, f: 0.6, sigma: 1.2, phi: 0}
          resolution: 48
          fill: by_sign
          data_label: "analytic surface from the equation"
          size_fraction: 0.62
      - id: gabor_label
        kind: equation_label
        style_role: emphasis
        equation: {id: gabor, highlight: [theta, f, sigma]}
        params: {text: "Gabor filter", anchor: top_right}
    actions:
      - id: orbit
        kind: orbit_camera
        to_theta_degrees: 310
        at_seconds: 0
        duration_seconds: 24
        easing: linear
      - id: rotate
        kind: vary_parameter
        target: gabor_surface
        parameter: theta
        to: 90
        at_seconds: 3
        duration_seconds: 5
        emphasize: [gabor_label]
      - id: frequency
        kind: vary_parameter
        target: gabor_surface
        parameter: f
        to: 1.6
        at_seconds: 9.5
        duration_seconds: 5
        emphasize: [gabor_label]
      - id: size
        kind: vary_parameter
        target: gabor_surface
        parameter: sigma
        to: 0.6
        at_seconds: 16
        duration_seconds: 5
        emphasize: [gabor_label]
    snapshots:
      - id: gabor_start
        at_seconds: 2
        description: "The filter at theta 0, f 0.6 and sigma 1.2 as a mesh with positive cells in blue and negative in red, the equation beside it, the camera near its starting angle."
      - id: rotating
        at_seconds: 5.5
        description: "Inside the first sweep: the carrier has turned part of the way towards 90 deg while the camera has moved on; the readout shows theta between 0 and 90."
      - id: rotated
        at_seconds: 8.5
        description: "The carrier at 90 deg; theta = 90.0 deg in the readout."
      - id: higher_frequency
        at_seconds: 15
        description: "More cycles under the same envelope: the readout reads f = 1.6 cycles/deg."
      - id: smaller
        at_seconds: 22
        description: "A narrower envelope: sigma = 0.6 deg in the readout; the camera has turned almost a full circle."
