schema_version: "1.0"
project_id: prf_tuning
based_on_animation_revision: "draft"
scenes:
  - id: prf
    start_seconds: 0
    end_seconds: 16
    purpose: "The pRF as a Gaussian over the visual field: move its centre, then grow its size, while the camera turns."
    narration:
      text: >-
        A population receptive field weights the visual field around a centre with a size. Moving
        the centre moves the hill across the field; growing sigma widens it.
    objects:
      - id: prf_surface
        kind: surface_plot
        style_role: primary_signal
        equation: {id: gaussian_prf}
        params:
          x_label: "x (deg)"
          y_label: "y (deg)"
          z_label: "g"
          x_range: [-8, 8]
          y_range: [-8, 8]
          z_range: [0, 1]
          expression: "exp(-((x - x_0)^2 + (y - y_0)^2) / (2 * sigma^2))"
          parameters: {x_0: 2, y_0: 0, sigma: 1.5}
          resolution: 40
          fill: by_height
          data_label: "analytic surface from the equation"
      - id: prf_label
        kind: equation_label
        style_role: emphasis
        equation: {id: gaussian_prf, highlight: [x_0, y_0, sigma]}
        params: {text: "population receptive field", anchor: top_right}
    actions:
      - id: orbit
        kind: orbit_camera
        to_theta_degrees: 40
        at_seconds: 0
        duration_seconds: 16
        easing: linear
      - id: move_x
        kind: vary_parameter
        target: prf_surface
        parameter: x_0
        to: -3
        at_seconds: 3
        duration_seconds: 4
        emphasize: [prf_label]
      - id: move_y
        kind: vary_parameter
        target: prf_surface
        parameter: y_0
        to: 3
        at_seconds: 3
        duration_seconds: 4
        emphasize: [prf_label]
      - id: grow
        kind: vary_parameter
        target: prf_surface
        parameter: sigma
        to: 3.5
        at_seconds: 8.5
        duration_seconds: 4
        emphasize: [prf_label]
    snapshots:
      - id: gaussian_visible
        at_seconds: 2
        description: "A narrow hill at (2, 0) deg over the visual field, the equation beside it; nothing has moved yet."
      - id: moving
        at_seconds: 5
        description: "Inside the two concurrent sweeps: the hill is between its start and (-3, 3) deg, two readouts under the equation show x₀ and y₀ on their way."
      - id: moved
        at_seconds: 7.5
        description: "The hill centred at (-3, 3) deg; the readouts read x₀ = -3.0 deg and y₀ = 3.0 deg."
      - id: grown
        at_seconds: 14
        description: "A broad hill: sigma = 3.5 deg in the third readout; the camera has turned a quarter circle."
