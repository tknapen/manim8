schema_version: "1.0"
project_id: prf_tuning
based_on_animation_revision: "draft"
scenes:
  - id: prf
    start_seconds: 0
    end_seconds: 12
    purpose: "One Gaussian population receptive field: move its centre, then grow its size."
    narration:
      text: >-
        A population receptive field weights the visual field around a centre with a size.
        Moving the centre shifts the profile; growing sigma widens it.
    objects:
      - id: profile_plot
        kind: function_plot
        style_role: primary_signal
        equation: {id: gaussian_prf}
        params:
          x_label: "visual field position x (deg)"
          y_label: "pRF weight g(x)"
          x_range: [-10, 10]
          y_range: [0, 1.2]
          anchor: center_left
          width_fraction: 0.55
          parameters: {x_0: 2, sigma: 1.5}
          series:
            - {label: "Gaussian pRF", expression: "exp(-((x - x_0)^2) / (2 * sigma^2))"}
          markers:
            - {x: "x_0", label: "x₀", style_role: secondary_text}
            - {x: "x_0 + sigma", label: "x₀ + σ", style_role: emphasis}
          data_label: "analytic curve from the equation"
      - id: prf_label
        kind: equation_label
        style_role: emphasis
        equation: {id: gaussian_prf, highlight: [x_0, sigma]}
        params: {text: "population receptive field", anchor: top_right}
    actions:
      - id: shift
        kind: vary_parameter
        target: profile_plot
        parameter: x_0
        to: -3
        at_seconds: 2.5
        duration_seconds: 3
        emphasize: [prf_label]
      - id: widen
        kind: vary_parameter
        target: profile_plot
        parameter: sigma
        to: 4
        at_seconds: 6.5
        duration_seconds: 4
        emphasize: [prf_label]
    snapshots:
      - id: gaussian_visible
        at_seconds: 2
        description: "The Gaussian profile centred at 2 deg with sigma 1.5 deg, its two markers, and the equation beside it; nothing has moved yet."
      - id: centre_shifted
        at_seconds: 6
        description: "After the first sweep the profile is centred at -3 deg and the readout under the equation reads x₀ = -3.0 deg; sigma is unchanged."
      - id: half_widened
        at_seconds: 8.5
        description: "Inside the second sweep: the profile is wider than before, the x₀ + σ marker has moved right, and a second readout shows sigma between 1.5 and 4 deg."
      - id: widened
        at_seconds: 11
        description: "After both sweeps: a broad profile centred at -3 deg, sigma = 4.0 deg in the readout, the x₀ + σ marker at 1 deg."
