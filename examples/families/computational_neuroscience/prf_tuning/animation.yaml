schema_version: "1.0"
id: prf_tuning
title: "The Gaussian population receptive field"
sources: []
output:
  duration_seconds: 45
  width_px: 1920
  height_px: 1080
  aspect_ratio: "16:9"
  fps: 30
  container: mp4
  video_codec: h264
  audio: none
style:
  name: tomas_scientific
  version: "0.2.0"
  overrides: {}
equations:
  - id: gaussian_prf
    typst: "g(x) = exp(-(x - x_0)^2 / (2 sigma^2))"
    latex: "g(x) = \\exp\\left(-\\frac{(x - x_0)^2}{2\\sigma^2}\\right)"
    symbols:
      g: {meaning: "pRF weight at visual field position x"}
      x: {meaning: "visual field position", units: "deg"}
      x_0: {meaning: "pRF centre (preferred position)", units: "deg"}
      sigma: {meaning: "pRF size (standard deviation)", units: "deg"}
audience: graduate_neuroscience
objective: >-
  Explain that a population receptive field summarizes how strongly a recording site
  responds to each visual field position, show the one-dimensional Gaussian model with
  its centre and size, and vary the size while the viewer watches so that what sigma
  does to the profile is seen rather than inferred from two panels.
scientific_constraints:
  - id: equation_exact
    kind: hard
    equation: gaussian_prf
    text: "Show the Gaussian pRF equation exactly as stored and define x, x_0 and sigma."
  - id: synthetic_label
    kind: hard
    text: "Label the plotted profiles as analytic curves computed from the equation, not as measurements."
  - id: fixed_axes
    kind: hard
    text: "While the size varies, keep the centre, the position axis and the weight axis fixed."
timeline:
  - id: introduction
    at_seconds: 0
    tolerance_seconds: 0
    kind: hard
    instruction: "State what a pRF is: a weight over visual field position."
  - id: gaussian
    at_seconds: 12
    tolerance_seconds: 2
    kind: preferred
    instruction: "Show one Gaussian profile with its centre and size."
  - id: equation
    at_seconds: 24
    tolerance_seconds: 1
    kind: hard
    instruction: "Show the equation and define its terms."
  - id: selectivity
    at_seconds: 34
    tolerance_seconds: 2
    kind: preferred
    instruction: "Vary the size continuously and show what it does to selectivity."
direction:
  tone: "Plain, precise, unhurried"
  avoid:
    - "Decorative motion"
    - "Unlabelled axes"
extensions: {}
