schema_version: "1.0"
project_id: divisive_normalization_intro
based_on_animation_revision: "example_initial"
scenes:
  - id: excitation
    start_seconds: 0
    end_seconds: 6
    purpose: "Excitatory drive alone: the response grows with it."
    narration:
      text: "The response begins with excitatory drive: as the drive grows, so does the response."
    objects:
      - id: drive_caption
        kind: text_caption
        style_role: foreground
        params: {text: "Excitatory drive alone", role: body}
      - id: drive_note
        kind: text_caption
        style_role: secondary_text
        params: {text: "the pool is held low", role: caption, below: drive_caption}
        reveal_at_seconds: 2
      - id: drive_curve
        kind: scientific_plot
        style_role: primary_signal
        data:
          source: responses
          encoding: {x: excitation_E, y: response_r, group: condition}
          transforms:
            - {op: filter, column: condition, equals: low_pool}
        params:
          x_label: "excitatory drive E"
          y_label: "response r"
          data_label: "synthetic data"
    snapshots:
      - id: excitation_visible
        at_seconds: 4
        description: "The caption with its note beneath it, and the synthetic excitation curve with labelled axes."
  - id: normalization
    start_seconds: 6
    end_seconds: 18
    purpose: "Divide by a normalization pool, then raise the pool and watch the response compress."
    narration:
      text: >-
        Dividing by a normalization pool P compresses it: as the pool grows, the same drive
        yields a smaller response.
    objects:
      - id: response_curve
        kind: function_plot
        style_role: primary_signal
        equation: {id: schematic_equation}
        params:
          x_label: "excitatory drive E"
          y_label: "response r"
          x_range: [0, 10]
          y_range: [0, 6]
          anchor: center_left
          width_fraction: 0.55
          parameters: {sigma: 1, P: 1}
          series:
            - {label: "schematic response", expression: "x / (sigma + P)"}
          data_label: "schematic curve from the equation"
      - id: normalization_equation
        kind: equation_block
        style_role: foreground
        equation: {id: schematic_equation, highlight: [P]}
        params: {anchor: top_right, scale: 0.9}
        reveal_at_seconds: 7
    actions:
      - id: raise_pool
        kind: vary_parameter
        target: response_curve
        parameter: P
        to: 4
        at_seconds: 8.5
        duration_seconds: 4
        emphasize: [normalization_equation]
    snapshots:
      - id: pool_introduced
        at_seconds: 8
        description: "The schematic response curve for P = 1 with the equation beside it, P highlighted."
      - id: pool_raised
        at_seconds: 14
        description: "After the sweep the curve is compressed to a fifth of its slope, the readout under the equation reads P = 4.0, and the axes are unchanged."
