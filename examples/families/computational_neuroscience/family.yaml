schema_version: "1.0"
id: computational_neuroscience
title: Computational Neuroscience
style:
  name: tomas_scientific
  version: "0.1.0"
environment:
  manager: uv
  project_root: "."
  lockfile: "uv.lock"
  install_policy: explicit
system_requirements:
  - kind: library
    name: cairo
    note: "pycairo links against the system Cairo library on Linux."
  - kind: font
    name: "DejaVu Sans"
    optional: true
    note: "Falls back to the style's font_fallbacks when absent."
shared_assets: []
components:
  - text_caption
  - scientific_plot
  - equation_label
  - equation_block
  - comparison_plot
schema_extensions: []
